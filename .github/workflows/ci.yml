name: CI
on:
  push:
    branches: [main, feat/itch-html5-release]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run lint
      - run: npm run package:itch
      - uses: actions/upload-artifact@v4
        with:
          name: polar-shift-html5
          path: polar-shift-html5.zip
          if-no-files-found: error
          retention-days: 14
